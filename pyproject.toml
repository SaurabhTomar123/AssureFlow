[project]
name = "assure-flow"
version = "1.0.0"
description = "Assure Flow: evidence-backed monthly GST purchase review inside Switch rooms"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "httpx==0.28.1",
    "websockets==17.4",
    "pymupdf==2.1",
    "pillow==13.0.0",
    "openpyxl>=3.1.5,<4",
    "anthropic>=1.0,<2",
    "structlog>=25.1,<26",
    "pyyaml==6.0.3",
    "python-multipart==0.0.33",
    "reportlab==5.1.0",
    "uuid6>=2025.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis>=6.130,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["api", "domain", "rules", "workers", "common", "adapters"]

[[tool.mypy.overrides]]
# PyMuPDF ships without type annotations; this is the only module that calls it.
module = ["adapters.pdf"]
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests/offline"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["api*", "domain*", "rules*", "workers*", "adapters*", "common*"]
