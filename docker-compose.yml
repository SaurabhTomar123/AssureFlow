version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: munimji_postgres
    environment:
      POSTGRES_USER: munimji_user
      POSTGRES_PASSWORD: munimji_password
      POSTGRES_DB: munimji
    ports:
      - "5432:5432"
    volumes:
      - munimji_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munimji_user -d munimji"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: munimji_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://munimji_user:munimji_password@postgres:5432/munimji
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  munimji_pgdata:
