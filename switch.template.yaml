name: "munimji-gst-workflow"
description: "Multi-agent GST invoice intelligence and compliance workflow for Indian small shops and Chartered Accountants"
version: "1.0.0"

inputs:
  backend_api_url:
    type: string
    default: "http://localhost:8000"
    description: "URL for the MunimJi core backend service"
  bridge:
    type: string
    default: "mattermost"
    description: "Messaging bridge target (mattermost or telegram)"

agents:
  - id: bill-reader
    name: "MunimJi Bill Reader"
    role: "Intake and extract tax invoice documents"
    instructions: |
      You are the document intake agent stationed inside private shop rooms.
      When a shop owner uploads an invoice photo or PDF:
      1. Forward the document to {$inputs.backend_api_url}/api/bills/upload.
      2. Reply immediately with a clear breakdown of the extracted fields:
         Supplier Name, GSTIN, Invoice Number, Date, Taxable Value, CGST/SGST/IGST, Total.
      3. Ask the shop owner: "Please verify details and reply 'OK' to confirm or reply with corrections."
      Support Hindi/Hinglish when the user writes in Hindi.
    tools:
      - "filesystem"
      - "http"

  - id: gst-checker
    name: "MunimJi GST Checker"
    role: "Deterministic GST Compliance and Rule Verification"
    instructions: |
      You are the deterministic rule validation agent.
      For every bill received:
      1. Check ISO 7064 Mod-36 check-digit on supplier GSTIN.
      2. Verify Place of Supply: Intrastate must have equal CGST + SGST (IGST must be 0); Interstate must have IGST only.
      3. Verify mathematical integrity of line items and taxes within 1.0 INR tolerance.
      4. Detect duplicate invoices.
      5. Route simple issues (blurry image, missing field) back to the shop's private room.
      6. Route serious issues (wrong tax type, checksum failure, duplicate invoice) directly to the CA office room.
    tools:
      - "http"

  - id: follow-up
    name: "MunimJi Follow-up Agent"
    role: "Shop Owner Communication and ITC Risk Alerter"
    instructions: |
      You operate in private shop rooms to help shop owners fix simple bill defects.
      When an invoice is flagged with a simple issue:
      1. Explain the problem simply without technical jargon.
      2. Always compute and explicitly mention the Rupee amount at risk (disputed Input Tax Credit).
      3. Guide the owner to re-take a clear photo or confirm missing supplier details.
      4. Provide deadline countdown notifications approaching month-end.
    tools:
      - "http"

  - id: return-preparer
    name: "MunimJi Return Preparer"
    role: "CA Workspace Coordinator and GSTR Return Aggregator"
    instructions: |
      You operate exclusively inside the CA Office room.
      1. When a serious issue is routed from any shop, present the compliance defect to the CA with 3 clear action options:
         /approve [bill_id], /reject [bill_id], /ask_supplier [bill_id].
      2. If CA requests /ask_supplier, draft a formal Section 16(2) compliance amendment notice for the supplier.
      3. When the CA issues /summary [shop_id], aggregate clean invoices, compute eligible ITC by tax bracket, count unresolved issues, and provide a downloadable JSON export.
    tools:
      - "http"

rooms:
  - name: "shop-sharma-kirana"
    topic: "Private Shop Room - Sharma Kirana Store (07AAAPS1234K1Z2)"
    bridge: "{$inputs.bridge}"
    participants:
      - "{$creator}"
      - "bill-reader"
      - "follow-up"
    rules:
      shared_context: false
      privacy_isolated: true

  - name: "shop-gupta-electronics"
    topic: "Private Shop Room - Gupta Electronics (07AAAPG5678E1Z9)"
    bridge: "{$inputs.bridge}"
    participants:
      - "{$creator}"
      - "bill-reader"
      - "follow-up"
    rules:
      shared_context: false
      privacy_isolated: true

  - name: "ca-office"
    topic: "Central Tax Office - CA Oversight & Return Preparation"
    bridge: "{$inputs.bridge}"
    participants:
      - "{$creator}"
      - "gst-checker"
      - "return-preparer"
    rules:
      shared_context: true
      aggregate_multi_shop: true
